# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric toolchain (shared by every supported Minecraft version)
# check these on https://fabricmc.net/develop
loader_version=0.19.5
loom_version=1.18-SNAPSHOT

# Which Minecraft version to build for. Each value has a matching file in versions/
# that pins the exact Minecraft + Fabric API versions. Override on the command line:
#   ./gradlew build -Pmc_target=26.2
mc_target=26.3

# Mod Properties
mod_version=1.0.0
maven_group=io.github.cmdralph
archives_base_name=modregfixer
