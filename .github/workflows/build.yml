# Builds the mod for every supported Minecraft version on every push and pull request.
name: build
on: [pull_request, push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mc_target: ['26.1', '26.2', '26.3']
    name: build (Minecraft ${{ matrix.mc_target }})
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build -Pmc_target=${{ matrix.mc_target }} --stacktrace
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: modregfixer-mc${{ matrix.mc_target }}
          path: build/libs/
